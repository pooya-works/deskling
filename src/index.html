<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deskling</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell" aria-label="Deskling companion">
      <header class="window-bar">
        <div class="window-actions">
          <button class="traffic-close" id="closeButton" type="button" aria-label="Close"></button>
          <button class="traffic-minimize" id="minimizeButton" type="button" aria-label="Minimize"></button>
        </div>
        <div class="brand">
          <span class="status-dot" id="statusDot" aria-hidden="true"></span>
          <span>Deskling</span>
        </div>
      </header>

      <section class="companion-panel">
        <p class="eyebrow" id="modeLabel">active</p>
        <div class="deskling" id="deskling" aria-hidden="true">
          <div class="egg">
            <span class="crack crack-one"></span>
            <span class="crack crack-two"></span>
            <span class="sprout"></span>
          </div>
          <div class="antenna"></div>
          <div class="head">
            <span class="eye eye-left"></span>
            <span class="eye eye-right"></span>
            <span class="mouth"></span>
          </div>
          <div class="body">
            <span class="heart"></span>
          </div>
          <div class="shadow"></div>
        </div>
        <h1 id="stateTitle">I am awake.</h1>
        <p id="stateCopy">Keep building. I will hang out here while you make things.</p>
        <div class="growth-panel" aria-label="Growth progress">
          <div class="growth-copy">
            <span id="stageLabel">egg</span>
            <strong><span id="growthPoints">0</span> growth</strong>
          </div>
          <div class="growth-track">
            <span id="growthBar"></span>
          </div>
        </div>
      </section>

      <section class="stats-panel" aria-label="Session stats">
        <div>
          <span class="stat-value" id="activeMinutes">0</span>
          <span class="stat-label">active min</span>
        </div>
        <div>
          <span class="stat-value" id="shipCount">0</span>
          <span class="stat-label">ships</span>
        </div>
        <div>
          <span class="stat-value" id="grassCount">0</span>
          <span class="stat-label">grass</span>
        </div>
      </section>

      <section class="garden-panel" aria-label="Tiny garden">
        <div class="garden-bed" id="gardenBed"></div>
      </section>

      <footer class="action-row">
        <button class="ship-button" id="shipButton" type="button">
          <span>Ship</span>
          <strong>+18 growth</strong>
        </button>
        <button class="grass-button" id="grassButton" type="button">
          <span>Plant</span>
          <strong>+5 growth</strong>
        </button>
        <button class="quiet-button" id="resetButton" type="button" aria-label="Reset progress">Reset</button>
      </footer>
    </main>

    <script src="./renderer.js"></script>
  </body>
</html>
